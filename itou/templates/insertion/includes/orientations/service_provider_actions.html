{% load matomo %}

<div class="c-box c-box--action">
    <h2 class="visually-hidden">Actions rapides</h2>
    <div class="form-row align-items-center gx-3">
        <div class="form-group col-12 col-lg-auto">
            <form method="post">
                {% csrf_token %}
                <button class="btn btn-lg btn-white btn-block btn-ico justify-content-center" type="submit" name="action" value="accept" {% matomo_event "orientation" "clic" "accepter" %}>
                    <i class="ri-check-line fw-medium" aria-hidden="true"></i>
                    <span>Accepter</span>
                </button>
            </form>
        </div>
        <div class="form-group col-12 col-lg-auto">
            <a href="{% url 'insertion_views:refuse_orientation' %}?token={{ link.pk }}" class="btn btn-lg btn-outline-white btn-block btn-ico" {% matomo_event "orientation" "clic" "décliner" %}>
                <i class="ri-close-line fw-medium" aria-hidden="true"></i>
                <span>Décliner</span>
            </a>
        </div>
        <div class="form-group col-12 col-lg d-lg-flex justify-content-lg-end">
            <div class="dropdown">
                <button id="other_actions" class="btn btn-lg btn-link-white btn-block w-lg-auto dropdown-toggle" type="button" aria-haspopup="true" aria-expanded="false" data-bs-toggle="dropdown">
                    Autres actions
                    {% if link.orientation.process.is_available %}
                        <span class="badge badge-base rounded-pill bg-info text-white ms-2">1</span>
                    {% endif %}
                </button>
                <div class="dropdown-menu w-100" aria-labelledby="other_actions">
                    {% if link.orientation.process.is_available %}
                        <form method="post">
                            {% csrf_token %}
                            <button class="btn btn-ico justify-content-start dropdown-item" type="submit" name="action" value="process" {% matomo_event "orientation" "clic" "étudier" %}>
                                <i class="ri-eye-line fw-medium" aria-hidden="true"></i>
                                <span>Étudier</span>
                            </button>
                        </form>
                    {% else %}
                        <button type="button"
                                class="btn btn-ico justify-content-start dropdown-item"
                                disabled
                                data-bs-toggle="tooltip"
                                data-bs-placement="top"
                                data-bs-custom-class="c-box--action-tooltip"
                                data-bs-title="Seule une orientation au statut « En cours de traitement » peut être mise à l’étude.">
                            <i class="ri-eye-line fw-medium" aria-hidden="true"></i>
                            <span>Étudier</span>
                        </button>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
