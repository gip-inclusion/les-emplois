<div class="form-group{% if field.field.required %} form-group-required{% endif %}{% if field.errors %} is-invalid{% endif %}">
    <label class="form-label">{{ field.label }}</label>
    <div id="id_{{ field.name }}" class="{% if field.errors %}is-invalid{% endif %}">
        {% for choice in field %}
            <div class="form-group">
                <div class="form-check">
                    <input id="{{ choice.id_for_label }}"
                           class="form-check-input{% if field.errors %} is-invalid{% endif %}"
                           type="checkbox"
                           name="{{ field.name }}"
                           value="{{ choice.data.value }}"
                           {% if choice.value %}checked{% endif %}
                           {% if field.errors %} aria-invalid="true"{% endif %}>
                    <label class="form-check-label" for="{{ choice.id_for_label }}">{{ choice.choice_label }}</label>
                </div>
            </div>
        {% endfor %}
    </div>
    {% if field.errors %}
        <div id="id_{{ field.name }}_error" class="w-100">
            {% for error in field.errors %}
                <div class="invalid-feedback d-block">{{ error }}</div>
            {% endfor %}
        </div>
    {% endif %}
</div>
