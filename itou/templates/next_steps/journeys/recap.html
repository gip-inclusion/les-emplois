{% load django_bootstrap5 %}
{# A confirmation step: the answers, then the button that saves them. #}
{% if form and form.is_bound %}
    {% bootstrap_form_errors form type="non_fields" %}
{% endif %}
<dl class="next-step-recap">
    {% for label, value in recap %}
        <div>
            <dt>{{ label }}</dt>
            <dd>
                {{ value }}
            </dd>
        </div>
    {% endfor %}
</dl>
