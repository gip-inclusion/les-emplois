{# A PASS IAE and what changes it, as blocks with their dates and today (next_steps_views.period_bar). No outer margin. #}
<figure class="next-step-frise mb-0{% if bar.today_display %} next-step-frise--today{% endif %}">
    {% if bar.blocks %}
        <div class="row g-1">
            {% for block in bar.blocks %}
                <div class="col-{{ block.columns }} next-step-frise__column">
                    <div class="next-step-frise__cell">
                        <div class="next-step-frise__block next-step-frise__block--{{ block.kind }}">
                            <span class="next-step-frise__label">{{ block.label }}</span>
                            <span class="next-step-frise__duration">{{ block.duration }}</span>
                        </div>
                        {% if block.today %}
                            {# The position is computed server side: a style attribute, like the employee record progress bar. #}
                            <span class="next-step-frise__today next-step-frise__today--{{ block.today_align }}"
                                  style="left: {{ block.today }}%">
                                <span class="next-step-frise__today-caption"><b>Aujourd’hui</b> {{ bar.today_display }}</span>
                            </span>
                        {% endif %}
                    </div>
                    <div class="next-step-frise__edges">
                        {% if block.left %}
                            <span class="next-step-frise__edge next-step-frise__edge--left">
                                <b>{{ block.left.date_display }}</b>
                                <small>{{ block.left.caption }}</small>
                            </span>
                        {% endif %}
                        {% if block.right %}
                            <span class="next-step-frise__edge next-step-frise__edge--right">
                                <b>{{ block.right.date_display }}</b>
                                <small>{{ block.right.caption }}</small>
                            </span>
                        {% endif %}
                    </div>
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% if bar.notes %}
        <figcaption class="next-step-frise__notes{% if not bar.blocks %} mt-0{% endif %}">
            {% for note in bar.notes %}
                <span class="next-step-frise__note next-step-frise__note--{{ note.variant }}">
                    <i class="{{ note.icon }}" aria-hidden="true"></i>
                    {{ note.text }}
                </span>
            {% endfor %}
        </figcaption>
    {% endif %}
</figure>
