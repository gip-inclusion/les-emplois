
{% if assignment.ended_at %}
    <span class="badge badge-xs rounded-pill bg-disabled-color-light text-primary">
        <i class="ri-time-line" aria-hidden="true"></i>
        Du {{ assignment.created_at|date:"d/m/Y" }} au {{ assignment.ended_at |date:"d/m/Y" }}
    </span>
{% else %}
    <span class="badge badge-xs rounded-pill bg-success-lighter text-success">
        <i class="ri-arrow-right-line" aria-hidden="true"></i>
        Depuis le {{ assignment.created_at|date:"d/m/Y" }}
    </span>
{% endif %}
