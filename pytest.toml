[pytest]
minversion = "9.0"
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests*.py", "test_*.py"]
filterwarnings = [
    "error",
    "ignore:.*Use timezone-aware objects to represent datetimes in UTC.*:DeprecationWarning:(botocore|django_datadog_logger)",
]
addopts = [
    "--reuse-db",
    "--strict-markers",
]
markers = [
    "no_django_db: mark tests that should not be marked with django_db.",
    "slow: slow tests that are skipped unless pytest is run with `--runslow`",
    "do_not_patch_accept_domain_based_on_mx: disable auto-patching of itou.emails.utils._accept_domain_based_on_mx",
]
