version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      # https://github.com/dependabot/dependabot-core/issues/6345
      - "/.github/actions/*"
      - "/.github/actions/setup/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
      exclude:
        - "itoutils"
    commit-message:
      prefix: "requirement"
      prefix-development: "dev requirement"
    # pyproject.toml pins the direct dependencies: rewrite the pin, uv.lock follows
    versioning-strategy: increase
    # Allow up to 20 concurrent open PRs
    open-pull-requests-limit: 20
    allow:
      # Allow both direct and indirect updates for all packages
      - dependency-type: all
    ignore:
      # Feature releases need a planned upgrade
      - dependency-name: "django"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # We need rsa signing compatibility, see https://github.com/gip-inclusion/les-emplois/pull/8071
      - dependency-name: "paramiko"
        versions:
          - ">=5"
    groups:
      psycopg:
        patterns:
          - "psycopg*"
      boto3:
        patterns:
          - "boto3"
          - "botocore"
          - "jmespath"
          - "s3transfer"
