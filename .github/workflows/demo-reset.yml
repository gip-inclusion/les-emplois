name: Reset demo environment

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🤝 Set the private key for Clever SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEMO_CLEVER_SSH_PRIVATE_KEY }}
        run: |
          mkdir ~/.ssh
          echo "sshgateway-clevercloud-customers.services.clever-cloud.com ssh-rsa " >> ~/.ssh/known_hosts
          echo "sshgateway-clevercloud-customers.services.clever-cloud.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFsvDx3AczrEJoF7WdyL8JaOTywQs3vR1AOEKW/i/Jlh" >>~/.ssh/known_hosts
          touch ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          echo "$SSH_PRIVATE_KEY" >~/.ssh/id_ed25519

      - name: ⏬ Install Clever Tools
        uses: ./.github/actions/clever-cli
        with:
          token: ${{ secrets.DEMO_CLEVER_TOKEN }}
          secret: ${{ secrets.DEMO_CLEVER_SECRET }}

      - name: 🧫 Reset the demo environment on CleverCloud
        env:
          ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
          BUCKET_NAME: ${{ secrets.DEMO_BUCKET_NAME }}
          DORA_TOKEN: ${{ secrets.DEMO_DORA_TOKEN }}
          BREVO_TOKEN: ${{ secrets.DEMO_BREVO_TOKEN }}
        run: |
          $CLEVER_CLI link app_ff3016cf-4ca6-46e3-a87d-77cf6f8f023f --alias demo-app
          OUTPUT_FILE=$(mktemp)
          # Always returns error code 0, as the SSH command succeeds.
          # %q quotes the values for the remote shell, whatever characters they contain.
          printf 'source .bashrc && cd app_* && scripts/reset --bucket-name %q --admin-password %q --dora-token %q --brevo-token %q\n' \
              "$BUCKET_NAME" "$ADMIN_PASSWORD" "$DORA_TOKEN" "$BREVO_TOKEN" | \
              $CLEVER_CLI ssh --alias demo-app | tee $OUTPUT_FILE
          grep --quiet "Reset of DEMO environment completed successfully." $OUTPUT_FILE
