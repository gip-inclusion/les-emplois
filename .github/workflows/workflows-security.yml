name: 🛡 Workflows security

on:
  pull_request:
    paths:
      - ".github/**"
      - ".pre-commit-config.yaml"
  schedule:
    # Catches the vulnerabilities disclosed after the actions were reviewed
    # Runs at 2:43 AM every Monday (arbitrary time to avoid the top of the hour)
    - cron: "43 2 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⏬ Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: 🛡 Audit the workflows with zizmor
        # Not covered by Dependabot: https://github.com/zizmorcore/zizmor/releases
        run: uvx zizmor@1.32.0 --format=github --strict-collection .
        env:
          # Enables the online audits (impostor commits, known vulnerable actions), read-only on a public repo
          GH_TOKEN: ${{ github.token }}
