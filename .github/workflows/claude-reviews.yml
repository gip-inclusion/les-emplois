name: 🤖 Claude reviews

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.action == 'labeled'
      && github.event.label.name == 'review-claude'
      && contains(github.event.pull_request.labels.*.name, 'noai') == false
      && contains(github.event.pull_request.labels.*.name, 'no-review') == false
    runs-on: ubuntu-latest
    environment: claude
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # We check out the PR head so file line numbers match the ones used by inline comments.
          ref: ${{ github.event.pull_request.head.sha }}
          # Full commit history (allowing for git log/blame context).
          fetch-depth: 0
          # File contents fetched lazily to speed up the cloning operation.
          filter: blob:none
      - name: 🎯 Point origin/HEAD to the base branch
        run: git remote set-head origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }} # comments are authored by `github-actions[bot]`
          # Versioned prompt based on the official plugin one, see .claude/commands/review-pr.md
          prompt: "/review-pr --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

  security-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'noai') == false
      && contains(github.event.pull_request.labels.*.name, 'no-review') == false
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'review-claude-sec')
        || (
          github.event.action != 'labeled'
          && vars.CLAUDE_SECURITY_REVIEW_AUTO == 'true'
          && github.event.pull_request.draft == false
          && github.actor != 'dependabot[bot]'
        )
      )
    runs-on: ubuntu-latest
    environment: claude
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-security-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # We keep the full commit history but fetch file contents on demand.
          filter: blob:none
      - name: 🎯 Point origin/HEAD to the base branch
        run: git remote set-head origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            DÉPÔT : ${{ github.repository }}
            NUMÉRO DE LA PR : ${{ github.event.pull_request.number }}

            Cette pull request est extraite dans le répertoire de travail courant
            et `origin/HEAD` pointe sur sa branche de base.

            1. Lance le skill intégré `security-review` avec l'outil Skill et suis ses
               instructions à la lettre, filtrage des faux positifs compris.
            2. Publie ensuite uniquement ce qui ressort de son rapport final.
               - Un commentaire par point identifié, sur la ligne concernée, avec
                 `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`),
                 précisant la sévérité, le scénario d'exploitation et le correctif recommandé ;
               - Dans le cas où le rapport ne mentionne aucun problème, publie un unique
                 court commentaire afin de l'indiquer avec
                 `gh pr comment ${{ github.event.pull_request.number }} --body "…"`.
            Pour toute commande `gh pr`, passe le numéro de la PR en premier argument
            (par exemple `gh pr view ${{ github.event.pull_request.number }}`).
            Rédige les commentaires en français. Ne publie que des commentaires GitHub,
            ne modifie aucun fichier.
          # `Read` is limited to the working directory; `gh pr` is limited to the reviewed PR.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Skill,Task,Agent,Read(./**),Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git remote show:*),Bash(gh pr comment ${{ github.event.pull_request.number }}:*),Bash(gh pr view ${{ github.event.pull_request.number }}:*),Bash(gh pr diff ${{ github.event.pull_request.number }}:*),mcp__github_inline_comment__create_inline_comment"
