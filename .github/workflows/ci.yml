name: 🔮 CI

on:
  pull_request:
  merge_group:
  # Allow this workflow to be triggered manually:
  # gh workflow run ci.yml --ref <branche>
  workflow_dispatch:

jobs:
  tests-shard:
    name: tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      # Like separate jobs: a failing shard doesn't cancel the others
      fail-fast: false
      matrix:
        # Tests are spread by a hash of their ID, which balances the shards as tests are added
        shard: [1, 2, 3, 4]
    env:
      CELLAR_ADDON_HOST_TEST: ${{ secrets.CLEVER_CELLAR_ADDON_HOST_FOR_TESTS }}
      CELLAR_ADDON_KEY_ID_TEST: ${{ secrets.CLEVER_CELLAR_ADDON_KEY_ID_FOR_TESTS }}
      CELLAR_ADDON_SECRET_KEY_TEST: ${{ secrets.CLEVER_CELLAR_ADDON_SECRET_KEY_FOR_TESTS }}
      DJANGO_SETTINGS_MODULE: config.settings.test
      # Shorten tracebacks to one line per failure to keep the CI logs readable.
      PYTEST_ADDOPTS: --tb=line
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: 6379
      REQUIREMENTS_PATH: requirements/test.txt
    concurrency:
      group: ${{ github.workflow }}-test-${{ matrix.shard }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      postgres:
        # Docker Hub image
        image: postgis/postgis:17-master
        env:
          POSTGRES_PASSWORD: password
        volumes:
          - /var/run/postgresql:/var/run/postgresql
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: 🤹 Django tests
        run: make test TARGET="--shard=${{ matrix.shard }}/${{ strategy.job-total }}"

  tests: # Single, stable entry point for the required status checks, whatever the number of shards
    needs: tests-shard
    # always() rather than !cancelled(): a skipped job counts as passing,
    # so this job must also run, and fail, when shards fail or are cancelled
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: ✅ Verify all shards passed
        # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#needs-context
        run: test "${{ needs.tests-shard.result }}" = success

  quality:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      REQUIREMENTS_PATH: requirements/test.txt
    concurrency:
      group: ${{ github.workflow }}-quality-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    services:
      postgres:
        # Docker Hub image
        image: postgis/postgis:17-master
        env:
          POSTGRES_PASSWORD: password
        volumes:
          - /var/run/postgresql:/var/run/postgresql
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: ✨ Verify quality
        run: make quality
      - name: ✨ Verify DB initialization (migrations, fixtures, ...)
        run: python manage.py migrate && make populate_db
