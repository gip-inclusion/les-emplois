name: 🔪 Review app removal

# Run this pipeline when a pull request having the label "review-app" is closed.
on:
  pull_request:
    types: [ unlabeled, closed ]

env:
  CLEVER_ORG_ID: orga_647d7c8e-c014-4346-b1cb-b97dc8fc6d25
  BRANCH: ${{ github.head_ref }}


jobs:
  delete:
    runs-on: ubuntu-latest
    if: >
      (github.event.action == 'unlabeled' && github.event.label.name == '1-recette-jetable')
      || (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, '1-recette-jetable'))
    permissions: {}

    steps:
    - name: 📥 Checkout to the PR branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: 🏷 Set review app name
      run:
        echo "REVIEW_APP_NAME=`echo \"c1-review-$BRANCH\" | sed -r 's/[^[:alnum:]-]+/-/g' | head -c 63 | tr '[:upper:]' '[:lower:]'`" >> $GITHUB_ENV

    - name: 🏷 Set database addon name
      run:
        echo "REVIEW_APP_DB_NAME=`echo $REVIEW_APP_NAME | sed -r 's/-/_/g'`" >> $GITHUB_ENV

    - name: ⏬ Install Clever Tools
      uses: ./.github/actions/clever-cli
      with:
        token: ${{ secrets.CLEVER_TOKEN }}
        secret: ${{ secrets.CLEVER_SECRET }}

    - name: 🤝 Find the application on Clever Cloud
      run: |
        $CLEVER_CLI link $REVIEW_APP_NAME --org $CLEVER_ORG_ID

    - name: ⏬ Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        prune-cache: true

    - name: 🗑 Delete S3 bucket
      run: uv run --script scripts/delete-buckets --use-case=review_app

    - name: 🗑 Delete the review app
      run: |
        $CLEVER_CLI delete --yes

    - name: 🗑 Delete the review app database
      run: |
        $CLEVER_CLI addon delete $REVIEW_APP_DB_NAME --org $CLEVER_ORG_ID --yes
