name: 'Setup CI'
description: 'Setup everything for the CI to run'
runs:
  using: "composite"
  steps:
    - name: Setup PostgreSQL environment
      run: |
        echo PGHOST=/var/run/postgresql >> $GITHUB_ENV
        echo PGUSER=postgres >> $GITHUB_ENV
      shell: bash
    - name: 🐘 Non-durable PostgreSQL
      run: |
        psql <<SQL
          ALTER SYSTEM SET fsync=off;
          ALTER SYSTEM SET synchronous_commit=off;
          ALTER SYSTEM SET full_page_writes=off;
        SQL
        docker kill --signal=SIGHUP ${{ job.services.postgres.id }}
      shell: bash
    # The Ubuntu mirror regularly slows down to a few kB/s: cache the packages.
    # PRs and the merge queue only restore their own caches and the ones created on main:
    # after bumping the key, seed it with `gh workflow run ci.yml --ref main`
    - name: 🔑 Spatial libraries cache key
      id: apt-cache-key
      # the .deb files depend on the Ubuntu release and on the CPU architecture:
      # `steps.apt-cache-key.outputs.key` will contain something like `apt-24.04-X64-gdal-bin-1`
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#setting-an-output-parameter
      # https://docs.github.com/en/actions/reference/workflows-and-actions/variables#default-environment-variables
      run: |
        . /etc/os-release
        echo "key=apt-$VERSION_ID-$RUNNER_ARCH-gdal-bin-1" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 💾 Restore spatial libraries cache
      id: apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # https://github.com/actions/cache v6.1.0
      with:
        key: ${{ steps.apt-cache-key.outputs.key }}
        path: ~/apt-cache/
    - name: 🌍 Download spatial libraries
      if: steps.apt-cache.outputs.cache-hit != 'true'
      # Django loads GDAL and GEOS with ctypes: no need for headers or compilers
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --download-only gdal-bin
        mkdir -p ~/apt-cache
        cp /var/cache/apt/archives/*.deb ~/apt-cache/
      shell: bash
    - name: 💾 Save spatial libraries cache
      if: steps.apt-cache.outputs.cache-hit != 'true'
      # Right away rather than at the end of the job, which failing tests would prevent
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # https://github.com/actions/cache v6.1.0
      with:
        key: ${{ steps.apt-cache-key.outputs.key }}
        path: ~/apt-cache/
    - name: 🌍 Install spatial libraries
      # Unlike `dpkg --install`, apt installs the packages in the order their dependencies require
      run: |
        if ! sudo apt-get install --no-install-recommends ~/apt-cache/*.deb; then
          echo "::warning::The cached spatial libraries no longer fit the runner image, bump the cache key"
          sudo apt-get update
          sudo apt-get install --no-install-recommends gdal-bin
        fi
      shell: bash
    - name: 💾 Create a database to check migrations
      run: |
        psql <<SQL
            CREATE DATABASE itou;
        SQL
      shell: bash
    - name: ⏬ Install uv
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        enable-cache: true
        prune-cache: true
        cache-dependency-glob: "requirements/test.txt"
    - name: 📥 Install dependencies
      run: |
        make venv
        echo ".venv/bin" >> $GITHUB_PATH
      shell: bash
    - name: 💾 Restore static files cache
      id: static-files-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: staticfiles-${{ hashFiles('itou/utils/staticfiles.py') }}
        path: |
          ~/.cache/itou_cached_assets/
    - name: 💾 Collect static files
      run: python manage.py collectstatic --no-input
      shell: bash
