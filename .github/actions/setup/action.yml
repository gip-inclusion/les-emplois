name: 'Setup CI'
description: 'Setup everything for the CI to run'
runs:
  using: "composite"
  steps:
    - name: Setup PostgreSQL environment
      run: |
        echo PGHOST=/var/run/postgresql >> $GITHUB_ENV
        echo PGUSER=postgres >> $GITHUB_ENV
      shell: bash
    - name: 🐘 Non-durable PostgreSQL
      run: |
        psql <<SQL
          ALTER SYSTEM SET fsync=off;
          ALTER SYSTEM SET synchronous_commit=off;
          ALTER SYSTEM SET full_page_writes=off;
        SQL
        docker kill --signal=SIGHUP "$POSTGRES_CONTAINER_ID"
      env:
        POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
      shell: bash
    # The Ubuntu mirror regularly slows down to a few kB/s: cache the packages.
    # PRs and the merge queue only restore their own caches and the ones created on main.
    # The schedule of ci.yml creates the weekly cache on main. To create it sooner, run `gh workflow run ci.yml --ref main`
    - name: 🔑 Spatial libraries cache key
      id: apt-cache-key
      # the .deb files depend on the Ubuntu release and on the CPU architecture, the week keeps them up to date:
      # `steps.apt-cache-key.outputs.key` will contain something like `apt-26.04-X64-gdal-bin-2026-45`
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#setting-an-output-parameter
      # https://docs.github.com/en/actions/reference/workflows-and-actions/variables#default-environment-variables
      run: |
        . /etc/os-release
        prefix="apt-$VERSION_ID-$RUNNER_ARCH-gdal-bin-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: 💾 Restore spatial libraries cache
      id: apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # https://github.com/actions/cache v6.1.0
      with:
        key: ${{ steps.apt-cache-key.outputs.key }}
        # Scheduled workflows can stop for weeks: an older cache still avoids most of the download
        restore-keys: ${{ steps.apt-cache-key.outputs.prefix }}
        path: ~/apt-cache/
    - name: 🌍 Download spatial libraries
      if: steps.apt-cache.outputs.cache-hit != 'true'
      # Django loads GDAL and GEOS with ctypes: no need for headers or compilers
      # If an older cache was restored, its .deb files are copied first so that apt only downloads the missing ones.
      # `find` rather than a glob: when no cache was restored, an unmatched glob is passed to `cp` as a literal and makes it fail
      run: |
        mkdir -p ~/apt-cache
        sudo find ~/apt-cache -name '*.deb' -exec cp -t /var/cache/apt/archives/ {} +
        sudo apt-get update
        sudo apt-get install --no-install-recommends --download-only gdal-bin
        cp /var/cache/apt/archives/*.deb ~/apt-cache/
      shell: bash
    - name: 💾 Save spatial libraries cache
      if: steps.apt-cache.outputs.cache-hit != 'true'
      # Right away rather than at the end of the job, which failing tests would prevent
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # https://github.com/actions/cache v6.1.0
      with:
        key: ${{ steps.apt-cache-key.outputs.key }}
        path: ~/apt-cache/
    - name: 🌍 Install spatial libraries
      # Given .deb paths, apt still downloads the packages from the mirror and only uses the files if that fails.
      # It reuses the files of its archives directory that match the versions it resolves, so when the cache and
      # the package lists of the image differ, the fallback only downloads the difference.
      run: |
        sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/
        if ! sudo apt-get install --no-install-recommends --no-download gdal-bin; then
          echo "::notice::The cached spatial libraries differ from the package lists of this runner image, downloading the difference"
          sudo apt-get update
          sudo apt-get install --no-install-recommends gdal-bin
        fi
      shell: bash
    - name: 💾 Create a database to check migrations
      run: |
        psql <<SQL
            CREATE DATABASE itou;
        SQL
      shell: bash
    - name: ⏬ Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        prune-cache: true
        cache-dependency-glob: "requirements/test.txt"
    - name: 📥 Install dependencies
      run: |
        make venv
        echo ".venv/bin" >> $GITHUB_PATH
      shell: bash
    - name: 💾 Restore static files cache
      id: static-files-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: staticfiles-${{ hashFiles('itou/utils/staticfiles.py') }}
        path: |
          ~/.cache/itou_cached_assets/
    - name: 💾 Collect static files
      run: python manage.py collectstatic --no-input
      shell: bash
